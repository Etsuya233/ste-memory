<!doctype html>
<html lang="zh-CN" data-theme="dark" data-accent="teal" data-font="system" data-size="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STE Memory · 表格页重设计原型</title>
<link rel="stylesheet" href="./prototype.css">
</head>
<body>

<!-- 图标库（内联 sprite；原型不引入外部依赖） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
  <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
  <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 2l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3L2 21h20L12 3z"/><path d="M12 9v5M12 17.5v.5"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3z"/><path d="M19 17l.8 2.2L22 20l-2.2.8L19 23l-.8-2.2L16 20l2.2-.8L19 17z"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6z"/></symbol>
</svg>

<header class="review-bar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg class="ic"><use href="#i-table"/></svg>
    </div>
    <div class="brand-text">
      <div class="brand-title">表格页 · 交互原型</div>
      <div class="brand-sub">STE Memory · 墨灰设计系统 · 2026-10-19</div>
    </div>
  </div>
  <div class="review-actions">
    <span class="review-badge">3 个方向</span>
    <button type="button" class="review-btn" data-action="reset-prototype">
      <svg class="ic ic--sm"><use href="#i-refresh"/></svg>重置数据
    </button>
    <button type="button" class="review-btn" data-action="toggle-appearance" aria-expanded="false">
      <svg class="ic ic--sm"><use href="#i-sliders"/></svg>外观
    </button>
  </div>
</header>

<div class="review-controls">
  <nav class="concept-switch" aria-label="原型方向">
    <button type="button" class="concept-tab is-active" data-action="set-concept" data-concept="workbench">
      <span class="concept-num">01</span><span>结构工作台</span><span class="concept-rec">推荐</span>
    </button>
    <button type="button" class="concept-tab" data-action="set-concept" data-concept="library">
      <span class="concept-num">02</span><span>表格库</span>
    </button>
    <button type="button" class="concept-tab" data-action="set-concept" data-concept="focus">
      <span class="concept-num">03</span><span>单表聚焦</span>
    </button>
  </nav>
  <div class="viewport-switch" role="group" aria-label="预览尺寸">
    <button type="button" data-action="set-viewport" data-viewport="mobile" class="is-active">手机</button>
    <button type="button" data-action="set-viewport" data-viewport="desktop">桌面</button>
  </div>
</div>

<main class="review-main">
  <section class="preview-col">
    <div class="stage-frame">
      <div class="device" id="device" data-viewport="mobile"></div>
    </div>
    <div class="stage-tip" id="stageTip"></div>
  </section>
  <aside class="notes" id="notes" aria-label="设计说明"></aside>
</main>

<div class="appearance-pop" id="appearancePop" hidden>
  <div class="ap-head">
    <span>外观旋钮</span>
    <button type="button" class="icon-btn icon-btn--sm" data-action="toggle-appearance" aria-label="关闭外观面板">
      <svg class="ic"><use href="#i-x"/></svg>
    </button>
  </div>

  <div class="ap-row">
    <span class="ap-label">主题</span>
    <div class="mini-seg" role="group" aria-label="主题">
      <button type="button" data-set-theme="dark" class="is-active">深色</button>
      <button type="button" data-set-theme="light">浅色</button>
    </div>
  </div>

  <div class="ap-row">
    <span class="ap-label">强调色</span>
    <div class="ap-swatches">
      <button type="button" class="swatch swatch--teal" data-set-accent="teal" aria-label="青绿"></button>
      <button type="button" class="swatch swatch--blue" data-set-accent="blue" aria-label="系统蓝"></button>
      <button type="button" class="swatch swatch--indigo" data-set-accent="indigo" aria-label="靛蓝"></button>
      <button type="button" class="swatch swatch--neutral" data-set-accent="neutral" aria-label="中性"></button>
    </div>
  </div>

  <div class="ap-row">
    <span class="ap-label">字体</span>
    <div class="mini-seg" role="group" aria-label="字体">
      <button type="button" data-set-font="system" class="is-active">系统</button>
      <button type="button" data-set-font="serif">衬线</button>
    </div>
  </div>

  <div class="ap-row">
    <span class="ap-label">字号</span>
    <div class="mini-seg" role="group" aria-label="字号">
      <button type="button" data-set-size="compact">紧凑</button>
      <button type="button" data-set-size="normal" class="is-active">标准</button>
      <button type="button" data-set-size="large">大</button>
    </div>
  </div>

  <div class="ap-foot">四旋钮与真实面板共用同一套语义令牌；修改只影响当前原型。</div>
</div>

<script src="./prototype.js"></script>
</body>
</html>
